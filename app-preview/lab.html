<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thabat — blocker lab</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/blocker.js"></script>
<style>
  body { display: block; padding: 24px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; background: var(--paper); padding: 24px; border-radius: 20px; }
  h1 { font-size: 1.6rem; } label { font-weight: 600; font-size: .9rem; display: grid; gap: 6px; }
  input, select { font: inherit; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: #fbf6ea; min-height: 44px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .out { padding: 14px; border-radius: 14px; background: #fbf6ea; line-height: 1.7; min-height: 56px; }
  .block { border-left: 6px solid var(--orange-deep); } .allow { border-left: 6px solid var(--sage-deep); }
</style>
</head>
<body>
<main>
  <h1>Blocker lab</h1>
  <p class="small">Developer page: try the site list and the app rules without a phone. Nothing here is sent anywhere.</p>
  <div class="row">
    <label>Site (domain)<input id="site" value="www.xvideos.com"></label>
    <label>Level<select id="lvl"><option value="soft">Light</option><option value="mid" selected>Medium</option><option value="hard">Strict</option></select></label>
  </div>
  <div class="row">
    <label>App package<input id="pkg" value="com.reddit.frontpage"></label>
    <label>App name<input id="label" value="Reddit"></label>
  </div>
  <label>Hour of day (0-23)<input id="hour" type="number" min="0" max="23" value="23"></label>
  <button class="cta" id="go" type="button">Check</button>
  <div class="out" id="o1"></div>
  <div class="out" id="o2"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("go").addEventListener("click", async () => {
  const level = $("lvl").value;
  const site = await isBlocked($("site").value.trim(), level);
  $("o1").className = "out " + (site ? "block" : "allow");
  $("o1").textContent = `Site ${$("site").value.trim()} → ${site ? "BLOCKED" : "allowed"} (${level})`;
  const r = await Blocker.appVerdict({ pkg: $("pkg").value.trim(), label: $("label").value.trim() }, level, +$("hour").value);
  $("o2").className = "out " + (r.action === "allow" ? "allow" : "block");
  $("o2").textContent = `App ${$("pkg").value.trim()} → ${r.action.toUpperCase()} · ${r.why}`;
});
$("go").click();
</script>
</body>
</html>
