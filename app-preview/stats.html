<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبات — جدارك</title>
<meta name="description" content="كل يوم نظيف طوبة. شاهد جدارك ومحاولات الحجب.">
<meta property="og:title" content="ثبات — الإحصائيات">
<meta property="og:image" content="assets/og.jpg">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3F5A3B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<style>
  .wall { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 22px; }
  .brick { aspect-ratio: 1.7; border-radius: 8px; border: 2px dashed var(--line); }
  .brick.on { background: var(--sage); border: 0; }
  /* the brick being laid right now fills from the right as the 24h pass */
  .brick.cur { border-color: var(--orange-deep); background: linear-gradient(to left, var(--orange) calc(var(--p, 0) * 100%), transparent 0); }
  .wall.empty + .empty-note { display: block; }
  .empty-note { display: none; margin-top: 12px; color: var(--ink-soft); }
  .pair { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 26px; align-items: end; }
  .fig { display: flex; align-items: center; gap: 10px; }
  .fig .i { color: var(--sage-deep); width: 30px; height: 30px; }
  .fig strong { font: 700 2.6rem/1 var(--font-display); color: var(--ink); }
  .fig.minor strong { font-size: 1.8rem; color: var(--ink-soft); }
  .fig.minor .i { width: 24px; height: 24px; }
  .cap { font-size: var(--t-small); color: var(--ink-soft); line-height: 1.3; }
</style>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="ico-btn" href="home.html" aria-label="رجوع"><i data-i="arrow" style="transform:scaleX(-1)"></i></a>
    <span class="mark">ثبات</span>
  </header>

  <img class="hero" src="assets/medals.jpg" alt="ثلاث ميداليات من الطين على رف: برتقالية وخضراء وذهبية بنجمة" width="900" height="900" style="width:min(62%,240px);margin-bottom:-6px">

  <h1 data-t>كل يوم <em>طوبة</em></h1>
  <p class="lead" id="lead">آخر خمسة أسابيع من جدارك.</p>

  <div class="wall" id="wall" role="img" aria-label="جدار الأيام"></div>
  <p class="empty-note" id="en">الجدار فارغ لأنك بدأت للتو. أول طوبة تكتمل تلقائياً بعد ٢٤ ساعة.</p>

  <div class="pair">
    <div class="fig"><i data-i="shield"></i><div><strong id="b">0</strong><div class="cap">محاولة حُجبت</div></div></div>
    <div class="fig minor"><i data-i="wind"></i><div><strong id="w">0</strong><div class="cap">لحظة رغبة عبرتها</div></div></div>
  </div>

  <div class="spacer"></div>
  <a class="cta calm" href="home.html" style="margin-top:20px"><i data-i="home"></i> العودة للرئيسية</a>
</main>
<script>
const s = store.get(), TOTAL = 35;
document.getElementById("b").textContent = s.blocked;
document.getElementById("w").textContent = s.wins;
(async () => {
  const c = await clock.read(), n = c.days;
  const start = Math.max(0, n - (TOTAL - 1)); // window slides once the wall is longer than 5 weeks
  const wall = document.getElementById("wall");
  for (let i = 0; i < TOTAL; i++) {
    const day = start + i, d = document.createElement("div");
    d.className = "brick" + (day < n ? " on" : day === n ? " cur" : "");
    if (day === n) d.style.setProperty("--p", c.progress);
    wall.appendChild(d);
  }
  if (n === 0) wall.classList.add("empty");
  const next = [7, 30, 90].find((m) => m > n);
  document.getElementById("lead").textContent = next
    ? T("الميدالية القادمة بعد {d}.", { d: daysLabel(next - n) })
    : T("جمعت الميداليات الثلاث. ثبّت جدارك.");
})();
</script>
</body>
</html>
