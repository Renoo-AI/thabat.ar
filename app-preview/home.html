<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبات — جدارك اليوم</title>
<meta name="description" content="طوبة جديدة كل ٢٤ ساعة تلقائياً. شاهد جدارك يكبر من طوبة إلى قلعة.">
<meta property="og:title" content="ثبات — الرئيسية">
<meta property="og:image" content="assets/og.jpg">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3F5A3B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<style>
  .count { display: flex; align-items: baseline; gap: 12px; margin-top: -8px; }
  .count strong { font: 800 clamp(5rem, 28vw, 7.5rem)/0.9 var(--font-display); color: var(--sage-deep); }
  .count span { font: 800 1.5rem/1 var(--font-display); color: var(--ink); }
  .track { height: 10px; border-radius: 999px; background: var(--paper-deep); margin-top: 14px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 999px; }
  .line { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: var(--t-small); color: var(--ink-soft); }
  .line .i { width: 20px; height: 20px; color: var(--sage-deep); }
  .line b { color: var(--ink); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  .line.warn, .line.warn .i { color: var(--orange-deep); }
  .line[hidden] { display: none; }
</style>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="ico-btn" href="settings.html" aria-label="الإعدادات"><i data-i="settings"></i></a>
    <span class="mark">ثبات</span>
    <a class="ico-btn" href="stats.html" aria-label="الإحصائيات"><i data-i="chart"></i></a>
  </header>

  <img class="hero" id="art" src="assets/first-brick.jpg" alt="" width="900" height="900">

  <div class="count"><strong id="n">0</strong><span id="u">يوم على جدارك</span></div>
  <div class="track" role="progressbar" aria-label="مقدار ما اكتمل من اليوم الحالي" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
  <p class="line"><i data-i="clock"></i><span>الطوبة القادمة بعد <b id="cd">--:--:--</b></span></p>
  <p class="line" id="lvl"><i data-i="shield"></i><span id="lv">الحماية تعمل</span></p>
  <p class="line warn" id="warn" hidden><i data-i="alert"></i><span id="wt"></span></p>
  <p class="small" id="next" style="margin-top:8px"></p>

  <div class="spacer"></div>
  <a class="cta" id="cta" href="learn.html" style="margin-top:20px"><i data-i="bulb"></i> <span id="ctl">هل تعلم؟</span></a>
</main>
<script>
const $ = (id) => document.getElementById(id);
const s = store.get();
const nat = native.status();                                   // null in a plain browser
const off = nat ? !(nat.vpn && nat.a11y) : (s.protect === false || new URLSearchParams(location.search).has("off"));

// the picture grows with the wall: one brick, a wall, a gate, a house, a castle
const STAGES = [
  { at: 0, img: "first-brick.jpg", crop: true, name: "أول طوبة", alt: "طوبة برتقالية مضيئة وحدها وبجانبها نبتة صغيرة" },
  { at: 1, img: "bricks.jpg", name: "جدار", alt: "جدار من الطوب الطيني وفوقه طوبة برتقالية مضيئة" },
  { at: 7, img: "st-gate.jpg", name: "بوابة", alt: "جدار طيني عليه نباتات وبوابة مضيئة" },
  { at: 30, img: "st-house.jpg", name: "بيت", alt: "بيت طيني صغير بسقف برتقالي ونافذة مضيئة" },
  { at: 90, img: "st-castle.jpg", name: "قلعة", alt: "قلعة طينية صغيرة بعلم ذهبي وبوابة مضيئة" },
];

let c, t0;
function paint() {
  const left = Math.max(0, c.nextIn - (performance.now() - t0));
  $("cd").textContent = hms(left);
  const p = 1 - left / DAY;
  $("bar").style.width = (p * 100).toFixed(2) + "%";
  $("bar").parentElement.setAttribute("aria-valuenow", Math.round(p * 100));
  if (left <= 0) location.reload(); // a brick just landed
}

let ticking = false;
function apply(cc) {
  c = cc;
  t0 = performance.now(); // ticks on a monotonic timer, so changing the phone clock mid-session does nothing
  $("warn").hidden = true;
  if (nat && nat.privateDns) { // Android "Private DNS" can bypass the DNS filter
    $("warn").hidden = false; $("wt").textContent = T("DNS خاص مفعّل في الهاتف وقد يتجاوز الحجب. عطّله من إعدادات الشبكة.");
  }

  $("n").textContent = c.days;
  $("u").textContent = unitDays(c.days);

  const a = $("art"), st = STAGES.filter((x) => c.days >= x.at).pop(), nx = STAGES.find((x) => x.at > c.days);
  a.src = "assets/" + st.img; a.alt = T(st.alt); a.removeAttribute("style");
  if (st.crop) Object.assign(a.style, { aspectRatio: "1.5", objectFit: "cover", objectPosition: "50% 88%", width: "100%" });
  $("next").textContent = nx ? T("بعد {d}: {n}", { d: daysLabel(nx.at - c.days), n: T(nx.name) }) : T("وصلت إلى القلعة. حافظ عليها.");

  $("lv").textContent = T("الحماية تعمل · مستوى {l}", { l: LEVELS[s.level] });
  const read = store.get().learned === c.days; // one card a day: once read, the button rests
  $("ctl").textContent = read ? T("قرأت معلومة اليوم") : T("معلومة اليوم");
  $("cta").classList.toggle("calm", read);
  if (c.tamper || (!c.online && !c.pending)) {
    $("warn").hidden = false;
    $("wt").textContent = c.tamper
      ? T("لاحظنا أن ساعة الهاتف تغيّرت فتجاهلناها. أيامك تُحسب من الوقت الحقيقي ولن تتأثر.")
      : T("لا يوجد إنترنت الآن. سنؤكد أيامك فور الاتصال.");
  }
  if (off) { // permission revoked: the open door replaces the wall
    a.src = "assets/off.jpg"; a.alt = T("باب طيني مفتوح وقفل ذهبي مفتوح على الأرض: الحماية متوقفة");
    a.removeAttribute("style");
    $("lv").textContent = T("الحماية متوقفة"); $("lvl").classList.add("warn");
    $("next").textContent = T("الحماية متوقفة فلا يُحجب أي موقع أو تطبيق الآن. أعد تفعيلها لتكمل.");
    $("cta").href = "permissions.html"; $("ctl").textContent = T("أعد تفعيل الحماية");
    $("cta").classList.remove("calm"); // the one thing to do now is primary
    const ic = $("cta").querySelector("i, svg"); // an <i> until icons are painted, an <svg> after
    if (ic.tagName === "I") ic.dataset.i = "shield"; else ic.innerHTML = ICONS.shield;
  }
  paint();
  if (!ticking) { ticking = true; setInterval(paint, 1000); }
}
apply(clock.local());            // instant, from the last sync
clock.read().then(apply);        // then correct it from the network clock
</script>
</body>
</html>
